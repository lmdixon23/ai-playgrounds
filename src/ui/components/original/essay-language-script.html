<script id="essay-language-script">
(() => {
  window.refreshEssayLanguage=()=>{const zh=(document.documentElement.lang||'en').startsWith('zh');document.querySelectorAll('[data-essay-lang]').forEach(el=>{el.hidden=(el.dataset.essayLang==='zh')!==zh})};
  window.refreshEssayLanguage();
  document.querySelectorAll('button[data-lang]').forEach(b=>b.addEventListener('click',()=>setTimeout(window.refreshEssayLanguage,30)));
})();
</script>
