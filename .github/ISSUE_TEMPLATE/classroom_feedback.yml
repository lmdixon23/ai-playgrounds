name: Classroom feedback
description: Report educator or learner-facing observations without student-identifying information
title: "[Classroom feedback] "
labels: ["classroom-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing AI Playgrounds. Do not include student names, email addresses, school identifiers, grades, screenshots containing learner information, or private share links. Aggregate observations are sufficient.
  - type: dropdown
    id: role
    attributes:
      label: Perspective
      options: [Educator, Learner, Curriculum designer, Accessibility reviewer, Other]
    validations:
      required: true
  - type: input
    id: applet
    attributes:
      label: Applet and release version
      placeholder: "KNN Classifier, v1.0.1"
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Intended learning task
      description: State the objective and the steps learners were asked to complete.
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: Observed result
      description: Describe aggregate patterns, confusion, accessibility barriers, or successful reasoning.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Did the applet introduce or repair a misconception?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed student-identifying and school-confidential information.
          required: true
