name: Translation review
description: Report a specific English/Simplified-Chinese semantic mismatch
title: "[Translation] "
labels: ["localization"]
body:
  - type: input
    id: applet
    attributes:
      label: Applet and release version
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: English text and context
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current Simplified-Chinese text
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed wording and semantic reason
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no student-identifying or school-confidential information.
          required: true
