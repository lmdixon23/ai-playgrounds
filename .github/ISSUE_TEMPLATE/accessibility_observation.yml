name: Accessibility observation
description: Report a reproducible barrier without claiming a complete conformance audit
title: "[Accessibility] "
labels: ["accessibility"]
body:
  - type: input
    id: page
    attributes:
      label: Page or applet and release version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system, input method, and assistive technology
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed result
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I am reporting a bounded observation, not declaring the whole project conformant or non-conformant.
          required: true
        - label: I removed student-identifying and school-confidential information.
          required: true
