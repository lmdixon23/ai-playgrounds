name: Fix v1.9 R4a CSS value normalization

on:
  push:
    branches:
      - refactor/v1.9-design-token-contract-r4a

permissions:
  contents: write

jobs:
  normalize-css-comparisons:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/v1.9-design-token-contract-r4a
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Normalize equivalent CSS hex notation in validator
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/design_tokens.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''    raise TokenContractError(f"No CSS scalar representation for token type {token_type!r}: {path}")\n\n\ndef style_contents'''
          replacement = '''    raise TokenContractError(f"No CSS scalar representation for token type {token_type!r}: {path}")\n\n\ndef normalize_css_atom(value: str) -> str:\n    normalized = value.strip().lower()\n    match = re.fullmatch(r"#([0-9a-f]{3})", normalized)\n    if match:\n        digits = match.group(1)\n        return "#" + "".join(char * 2 for char in digits)\n    return normalized\n\n\ndef style_contents'''
          if anchor not in text:
              raise SystemExit('css normalization insertion anchor missing')
          text = text.replace(anchor, replacement, 1)
          replacements = {
              'require(actual == expected, f"Theme token mismatch {slug} {selector} {variable}: {actual} != {expected}")':
                  'require(normalize_css_atom(actual) == normalize_css_atom(expected), f"Theme token mismatch {slug} {selector} {variable}: {actual} != {expected}")',
              'require(root["--accent"] == light_value, f"Light page accent token drift: {slug}: {root[\'--accent\']} != {light_value}")':
                  'require(normalize_css_atom(root["--accent"]) == normalize_css_atom(light_value), f"Light page accent token drift: {slug}: {root[\'--accent\']} != {light_value}")',
              'require(dark["--accent"] == dark_value, f"Dark page accent token drift: {slug}")':
                  'require(normalize_css_atom(dark["--accent"]) == normalize_css_atom(dark_value), f"Dark page accent token drift: {slug}")',
              'require(dark["--accent-strong"] == strong_value, f"Dark strong accent token drift: {slug}")':
                  'require(normalize_css_atom(dark["--accent-strong"]) == normalize_css_atom(strong_value), f"Dark strong accent token drift: {slug}")',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'validator comparison anchor missing: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit validator correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/design_tokens.py
          git commit -m 'v1.9 R4a: normalize equivalent CSS hex notation'
          git push origin HEAD:refactor/v1.9-design-token-contract-r4a
