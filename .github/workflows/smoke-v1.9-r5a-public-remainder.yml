name: Smoke v1.9 R5a public remainder

on:
  push:
    branches:
      - refactor/v1.9-public-remainder-ownership-r5a

permissions:
  contents: read

jobs:
  validate-public-remainder:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run complete R5a ownership and two-build regression gate
        run: python tools/test_v1_9_public_remainder_r5a.py
