name: Bootstrap v1.9 R1 catalogue

on:
  push:
    branches:
      - refactor/v1.9-canonical-catalogue-r1

permissions:
  contents: write

jobs:
  materialize-canonical-catalogue:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R1 branch
        uses: actions/checkout@v4
        with:
          ref: refactor/v1.9-canonical-catalogue-r1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build exact byte-locked current product
        run: python tools/build_current.py

      - name: Materialize exact deployed catalogue as canonical source
        run: |
          mkdir -p src/product
          cp _site/applets.json src/product/catalogue.json
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('src/product/catalogue.json')
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          expected = '60ec062792c19f429edcd5aea0fc719c0c0aced66163c4c7257ac6c04149d55f'
          if digest != expected:
              raise SystemExit(f'catalogue digest mismatch: {digest} != {expected}')
          print(f'canonical catalogue SHA-256: {digest}')
          PY

      - name: Commit canonical catalogue snapshot
        run: |
          if git diff --quiet -- src/product/catalogue.json && git ls-files --error-unmatch src/product/catalogue.json >/dev/null 2>&1; then
            echo 'Canonical catalogue already materialized; no commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/product/catalogue.json
          git commit -m 'v1.9 R1: materialize canonical deployed catalogue'
          git push origin HEAD:refactor/v1.9-canonical-catalogue-r1
