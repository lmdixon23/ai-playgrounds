name: Bootstrap v1.9 R2 modern peer sources

on:
  push:
    branches:
      - refactor/v1.9-modern-peer-source-r2

permissions:
  contents: write

jobs:
  materialize-modern-peer-sources:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R2 branch
        uses: actions/checkout@v6
        with:
          ref: refactor/v1.9-modern-peer-source-r2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build exact byte-locked current product
        run: python tools/build_current.py

      - name: Materialize exact current modern pages as peer sources
        run: |
          mkdir -p src/labs/transformer-language-model src/labs/agent-tool-context src/labs/minimax-alpha-beta
          cp _site/playgrounds/transformer-language-model/index.html src/labs/transformer-language-model/index.html
          cp _site/playgrounds/agent-tool-context/index.html src/labs/agent-tool-context/index.html
          cp _site/playgrounds/minimax-alpha-beta/index.html src/labs/minimax-alpha-beta/index.html
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('.')
          oracle = json.loads((root / 'src/product/public-artifact-sha256.json').read_text(encoding='utf-8'))
          pairs = {
              'transformer-language-model': 'playgrounds/transformer-language-model/index.html',
              'agent-tool-context': 'playgrounds/agent-tool-context/index.html',
              'minimax-alpha-beta': 'playgrounds/minimax-alpha-beta/index.html',
          }
          for slug, public_path in pairs.items():
              source = root / 'src' / 'labs' / slug / 'index.html'
              digest = hashlib.sha256(source.read_bytes()).hexdigest()
              expected = oracle[public_path]
              if digest != expected:
                  raise SystemExit(f'{slug} digest mismatch: {digest} != {expected}')
              print(f'{slug}: {digest}')
          PY

      - name: Commit canonical current-page sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/labs/transformer-language-model/index.html src/labs/agent-tool-context/index.html src/labs/minimax-alpha-beta/index.html
          if git diff --cached --quiet; then
            echo 'Modern peer sources already materialized; no commit needed.'
            exit 0
          fi
          git commit -m 'v1.9 R2: materialize modern peer current-page sources'
          git push origin HEAD:refactor/v1.9-modern-peer-source-r2
