name: R2 final freeze KNN diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r2-final-pr-runner.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Materialize immutable direct patch
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/22f3029321a7bab515b7c0f00b132660f4d60721/.github/workflows/r2-guided-bootstrap.yml" -o /tmp/direct.yml
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/direct.yml').read_text(encoding='utf-8')
          names={'patch':'Apply English freeze directly to exact R2 head','install':'Install browser QA dependencies'}
          for key,name in names.items():
              marker=f'      - name: {name}\n'
              a=s.index(marker)
              a=s.index('        run: |\n',a)+len('        run: |\n')
              b=s.find('\n      - name:',a)
              if b<0:b=len(s)
              raw=s[a:b]
              prefix=' '*10
              code='\n'.join(line[len(prefix):] if line.startswith(prefix) else line for line in raw.splitlines())+'\n'
              Path(f'/tmp/{key}.sh').write_text(code,encoding='utf-8')
          print('DIAGNOSTIC_MATERIALIZATION=PASS')
          PY

      - name: Apply exact frozen candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/r2
          bash /tmp/patch.sh

      - name: Install browser QA dependencies
        run: bash /tmp/install.sh

      - name: Instrument KNN state transitions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/r2/tools/guided_challenge_qa.py')
          s=p.read_text(encoding='utf-8-sig')
          a=s.index('SLUGS=[')
          b=s.index('\n\ndef launch',a)
          s=s[:a]+"SLUGS=['knn-classifier']"+s[b:]
          old="""def wait_state(page,want,timeout=5000):
    page.wait_for_function('(want) => window.__suiteGuidedChallenge && window.__suiteGuidedChallenge.state() === want',arg=want,timeout=timeout)
"""
          new="""def wait_state(page,want,timeout=8000):
    cur=state(page)
    native=page.evaluate('''() => ({
      suite: window.__suiteGuidedChallenge?.state() || null,
      history: window.__suiteGuidedChallenge?.history?.() || [],
      lock: document.querySelector('#guidedLock') ? {disabled:document.querySelector('#guidedLock').disabled} : null,
      reveal: document.querySelector('#guidedReveal') ? {disabled:document.querySelector('#guidedReveal').disabled} : null,
      result: document.querySelector('#guidedResult') ? {hidden:document.querySelector('#guidedResult').hidden,text:document.querySelector('#guidedResult').textContent.trim().slice(0,160)} : null,
      lang: document.documentElement.lang
    })''')
    print('WAIT_STATE_BEGIN',want,'current=',cur,'native=',json.dumps(native,ensure_ascii=False),flush=True)
    try:
        page.wait_for_function('(want) => window.__suiteGuidedChallenge && window.__suiteGuidedChallenge.state() === want',arg=want,timeout=timeout)
    except Exception:
        native=page.evaluate('''() => ({
          suite: window.__suiteGuidedChallenge?.state() || null,
          history: window.__suiteGuidedChallenge?.history?.() || [],
          lock: document.querySelector('#guidedLock') ? {disabled:document.querySelector('#guidedLock').disabled} : null,
          reveal: document.querySelector('#guidedReveal') ? {disabled:document.querySelector('#guidedReveal').disabled} : null,
          result: document.querySelector('#guidedResult') ? {hidden:document.querySelector('#guidedResult').hidden,text:document.querySelector('#guidedResult').textContent.trim().slice(0,160)} : null,
          lang: document.documentElement.lang
        })''')
        print('WAIT_STATE_TIMEOUT',want,'native=',json.dumps(native,ensure_ascii=False),flush=True)
        raise
    print('WAIT_STATE_REACHED',want,'history=',history(page),flush=True)
"""
          if s.count(old)!=1: raise RuntimeError('wait_state block mismatch')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8',newline='\n')
          print('KNN_DIAGNOSTIC_INSTRUMENTATION=PASS')
          PY

      - name: Run KNN-only Guided Challenge diagnostic
        working-directory: /tmp/r2
        run: |
          set -euo pipefail
          python tools/guided_challenge_qa.py
