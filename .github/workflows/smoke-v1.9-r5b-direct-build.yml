name: Smoke v1.9 R5b direct canonical build

on:
  push:
    branches:
      - refactor/v1.9-direct-canonical-build-r5b

permissions:
  contents: read

jobs:
  direct-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run complete R5b direct-build independence gate
        run: python tools/test_v1_9_direct_canonical_build_r5b.py
