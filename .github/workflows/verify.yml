name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Release and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Materialize assistant-reviewed R4 semantic files
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/v1.1.0-vi-es-localization-r4'
        shell: bash
        run: |
          set -euo pipefail
          test -d .r4-assistant-review
          cat .r4-assistant-review/common.b64.part* | base64 -d | gzip -d > assets/locales/common-r4.js
          cp .r4-assistant-review/verify_r4_locale_catalog.py tools/verify_r4_locale_catalog.py
          cp .r4-assistant-review/R4_ASSISTANT_TRANSLATION_AUDIT.md docs/R4_ASSISTANT_TRANSLATION_AUDIT.md
          echo '37a5d685f18829296fd61f749677797822a8f0c593f19d18a6495fa1da0dbb06  assets/locales/common-r4.js' | sha256sum -c -
          echo '5b55f4b747864632585b7d6ad799314582dfd5ddc59fbf77e466240ce7a843b1  tools/verify_r4_locale_catalog.py' | sha256sum -c -
          echo 'f8e9ce5ee9ffaa2ca434fb9ccc8df60d68dbf263c6e0585e6725c4aab60ae9f0  docs/R4_ASSISTANT_TRANSLATION_AUDIT.md' | sha256sum -c -
          node --check assets/locales/common-r4.js
          python -m py_compile tools/verify_r4_locale_catalog.py
          git diff --check
          echo 'R4_REVIEWED_MATERIALIZATION=PASS'

      - name: Install browser QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run release checks
        run: python tools/release_check.py

      - name: Verify pedagogical contracts
        run: python tools/verify_pedagogical_contracts.py

      - name: Verify guided challenge contracts
        run: python tools/verify_guided_challenges.py

      - name: Run guided challenge state QA
        run: python tools/guided_challenge_qa.py

      - name: Verify Simplified Chinese parity contracts
        run: python tools/verify_zh_parity.py

      - name: Run Simplified Chinese browser parity QA
        run: python tools/zh_parity_qa.py

      - name: Verify Vietnamese and Spanish R4 localization
        run: python tools/verify_r4_localization.py

      - name: Verify all dynamic Wumpus percept translations
        run: python tools/verify_wumpus_percept_localization.py

      - name: Run Vietnamese and Spanish R4 browser QA
        run: python tools/r4_localization_qa.py

      - name: Check versioned release metadata
        run: python tools/check_release_metadata.py

      - name: Verify minimal deployment boundary
        run: python tools/build_site.py

      - name: Run 45 algorithm regression tests
        run: python tools/run_algorithm_tests.py

      - name: Run browser and responsive QA
        run: python tools/browser_qa.py --no-screenshots

      - name: Finalize tested assistant-reviewed R4 tree
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/v1.1.0-vi-es-localization-r4'
        shell: bash
        run: |
          set -euo pipefail
          # Restore the permanent Verify workflow and remove all one-use staging.
          git show b830d968986be78af89649493ee1d03b1c8f7d73:.github/workflows/verify.yml > .github/workflows/verify.yml
          rm -f .github/workflows/_r4-assistant-semantic-review.yml
          rm -rf .r4-assistant-review
          git diff --check
          python - <<'PY'
          import subprocess
          allowed={
            '.github/workflows/verify.yml',
            '.github/workflows/_r4-assistant-semantic-review.yml',
            '.r4-assistant-review/R4_ASSISTANT_TRANSLATION_AUDIT.md',
            '.r4-assistant-review/verify_r4_locale_catalog.py',
            '.r4-assistant-review/common.b64.part00',
            '.r4-assistant-review/common.b64.part01',
            '.r4-assistant-review/common.b64.part02',
            '.r4-assistant-review/common.b64.part03',
            '.r4-assistant-review/common.b64.part04',
            'assets/locales/common-r4.js',
            'docs/R4_ASSISTANT_TRANSLATION_AUDIT.md',
            'tools/verify_r4_locale_catalog.py',
          }
          raw=subprocess.check_output(['git','status','--porcelain=v1','-z'])
          got=set()
          for row in [x for x in raw.split(b'\0') if x]:
              text=row.decode('utf-8','replace')
              if len(text)>=4: got.add(text[3:])
          if got != allowed:
              raise SystemExit(f'Finalization boundary mismatch. Missing={sorted(allowed-got)} Unexpected={sorted(got-allowed)}')
          print('R4_REVIEW_FINALIZATION_BOUNDARY=PASS')
          PY
          git add -A -- \
            .github/workflows/verify.yml \
            .github/workflows/_r4-assistant-semantic-review.yml \
            .r4-assistant-review \
            assets/locales/common-r4.js \
            docs/R4_ASSISTANT_TRANSLATION_AUDIT.md \
            tools/verify_r4_locale_catalog.py
          git diff --cached --check
          git config user.name 'Logan M. Dixon'
          git config user.email '178442787+lmdixon23@users.noreply.github.com'
          git commit -m 'Integrate assistant-reviewed Vietnamese and Spanish semantics'
          git push origin HEAD:refs/heads/feature/v1.1.0-vi-es-localization-r4
          echo "FINAL_REVIEWED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'R4_ASSISTANT_REVIEW_FINALIZED=PASS' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-playgrounds-verification-${{ github.run_id }}
          path: release-evidence/
          if-no-files-found: ignore
          retention-days: 90
