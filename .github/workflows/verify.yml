name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Release and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Apply candidate-only R4 browser QA compatibility patch
        if: github.event_name == 'pull_request' && github.head_ref == 'automation/r4-generated-candidate'
        run: |
          set -euo pipefail
          python -m py_compile tools/_r4_browser_qa_fix.py
          python tools/_r4_browser_qa_fix.py
          python -m py_compile tools/browser_qa.py
          git diff --check

      - name: Install browser QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run release checks
        run: python tools/release_check.py

      - name: Verify pedagogical contracts
        run: python tools/verify_pedagogical_contracts.py

      - name: Verify guided challenge contracts
        run: python tools/verify_guided_challenges.py

      - name: Run guided challenge state QA
        run: python tools/guided_challenge_qa.py

      - name: Verify Simplified Chinese parity contracts
        run: python tools/verify_zh_parity.py

      - name: Run Simplified Chinese browser parity QA
        run: python tools/zh_parity_qa.py

      - name: Verify Vietnamese and Spanish R4 localization
        run: python tools/verify_r4_localization.py

      - name: Run Vietnamese and Spanish R4 browser QA
        run: python tools/r4_localization_qa.py

      - name: Check versioned release metadata
        run: python tools/check_release_metadata.py

      - name: Verify minimal deployment boundary
        run: python tools/build_site.py

      - name: Run 45 algorithm regression tests
        run: python tools/run_algorithm_tests.py

      - name: Run browser and responsive QA
        run: python tools/browser_qa.py --no-screenshots

      - name: Publish tested R4 browser QA compatibility fix
        if: github.event_name == 'pull_request' && github.head_ref == 'automation/r4-generated-candidate'
        run: |
          set -euo pipefail
          cp tools/browser_qa.py /tmp/browser_qa.py
          git fetch --no-tags origin "refs/heads/${GITHUB_HEAD_REF}:refs/remotes/origin/${GITHUB_HEAD_REF}"
          git checkout -B "${GITHUB_HEAD_REF}" "refs/remotes/origin/${GITHUB_HEAD_REF}"
          cp /tmp/browser_qa.py tools/browser_qa.py
          rm -f tools/_r4_browser_qa_fix.py
          rm -f .github/workflows/_r4-browser-qa-compat-repair.yml
          git fetch --no-tags --depth=1 origin main
          git show FETCH_HEAD:.github/workflows/verify.yml > .github/workflows/verify.yml
          git diff --check
          git add -- tools/browser_qa.py tools/_r4_browser_qa_fix.py .github/workflows/_r4-browser-qa-compat-repair.yml .github/workflows/verify.yml
          staged="$(git diff --cached --name-only | sort)"
          expected=$'.github/workflows/_r4-browser-qa-compat-repair.yml\n.github/workflows/verify.yml\ntools/_r4_browser_qa_fix.py\ntools/browser_qa.py'
          test "$staged" = "$expected"
          git diff --cached --check
          git config user.name 'Logan M. Dixon'
          git config user.email '178442787+lmdixon23@users.noreply.github.com'
          git commit -m 'Make full browser QA R4 locale aware'
          git push origin HEAD:"refs/heads/${GITHUB_HEAD_REF}"
          echo "R4_TESTED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'FINAL_R4_BROWSER_QA_COMPATIBILITY_FIX=PASS' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-playgrounds-verification-${{ github.run_id }}
          path: release-evidence/
          if-no-files-found: ignore
          retention-days: 90
