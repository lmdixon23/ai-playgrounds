name: Verify v1.9 canonical source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-v19-canonical-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-source:
    name: Canonical source equivalence and ownership
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify canonical Quick Assign ownership and frozen 58-file artifact
        run: python tools/test_v1_9_canonical_quick_assign_registry_r6a.py
      - name: Upload current canonical-source evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-playgrounds-v1.9-canonical-source-${{ github.run_id }}
          path: |
            release-evidence/v1.9-canonical-source-r0.json
            release-evidence/v1.9-canonical-source-r1.json
            release-evidence/v1.9-canonical-source-r2.json
            release-evidence/v1.9-canonical-source-r3.json
            release-evidence/v1.9-canonical-source-r4a.json
            release-evidence/v1.9-canonical-source-r4b.json
            release-evidence/v1.9-canonical-source-r5a.json
            release-evidence/v1.9-canonical-source-r5b.json
            release-evidence/v1.9-canonical-source-r6a.json
          if-no-files-found: error
          retention-days: 90
