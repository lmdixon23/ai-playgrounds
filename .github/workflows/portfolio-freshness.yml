name: Portfolio freshness

on:
  release:
    types: [published]
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published AI Playgrounds tag to check; leave blank for latest
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: portfolio-freshness-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Public portfolio release boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify checker regressions
        run: python tools/test_portfolio_freshness.py
      - name: Check live portfolio against the published release
        env:
          AI_PLAYGROUNDS_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/check_portfolio_freshness.py
