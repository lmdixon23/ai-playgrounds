name: Migrate v1.9 R5a current build contract

on:
  push:
    branches:
      - refactor/v1.9-public-remainder-ownership-r5a

permissions:
  contents: write

jobs:
  migrate-r5a-build-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/v1.9-public-remainder-ownership-r5a
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Make public-remainder ownership a current-build invariant
        run: python tools/migrate_v1_9_r5a_build_contract_v2.py
      - name: Commit R5a release and build integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/product/release.json tools/build_current.py
          git diff --cached --quiet && exit 0
          git commit -m "v1.9 R5a: bind current build to public remainder ownership"
          git push origin HEAD:refactor/v1.9-public-remainder-ownership-r5a
