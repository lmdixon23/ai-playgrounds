name: Refactor v1.9 R4b token layers

on:
  push:
    branches:
      - refactor/v1.9-token-owned-components-r4b

permissions:
  contents: write

jobs:
  refactor-token-layers:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/v1.9-token-owned-components-r4b
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Make design_tokens consume the shared low-level token engine
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/design_tokens.py')
          text = path.read_text(encoding='utf-8')
          marker = 'def style_contents(html: str) -> list[str]:\n'
          if marker not in text:
              raise SystemExit('design_tokens style_contents boundary missing')
          suffix = text[text.index(marker):]
          prefix = '''#!/usr/bin/env python3
from __future__ import annotations

import re
from pathlib import Path
from typing import Any

import page_components
import token_values
from token_values import (
    ALIAS_RE,
    EXPECTED_FORMAT,
    EXPECTED_SCHEMA,
    HEX_RE,
    TOKENS,
    TokenContractError,
    alias_target,
    collect_tokens,
    css_number,
    css_value,
    load_json,
    normalize_css_atom,
    require,
    resolve_token,
    validate_color,
    validate_dimension,
    validate_literal,
    validate_shadow,
)

ROOT = token_values.ROOT
BINDINGS = ROOT / "src" / "design" / "current-bindings.json"
CATALOGUE = ROOT / "src" / "product" / "catalogue.json"
CUSTOM_PROPERTY_RE = re.compile(r"(--[A-Za-z0-9_-]+)\\s*:\\s*([^;{}]+)")
STYLE_OPEN_RE = re.compile(r"<style\\b[^>]*>", re.IGNORECASE)


'''
          path.write_text(prefix + suffix, encoding='utf-8')
          PY
      - name: Verify refactor preserves R4a contract and R4b candidate rendering
        run: |
          python tools/design_tokens.py
          python tools/token_components.py
      - name: Commit token-layer refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/design_tokens.py
          git commit -m 'v1.9 R4b: share one low-level DTCG token engine'
          git push origin HEAD:refactor/v1.9-token-owned-components-r4b
