name: R1 final audit self-heal v6

on:
  push:
    branches:
      - automation/r1-final-audit-selfheal-v6

permissions:
  contents: write

env:
  EXPECTED_HEAD: 76a5aad0e0acd2c402fb15f40037504dd7d41ed1
  EXPECTED_BASE: 19d9a22aef9f537c01866964afbf8d1755c8a3c0
  PR_BRANCH: feature/v1.1.0-pedagogical-hardening-r1
  AUTOMATION_BRANCH: automation/r1-final-audit-selfheal-v6
  PAYLOAD_GZIP_SHA256: 611dd2069e412e44146ee12e53c931095b811a6306102daccde3d2df031ae8f0
  PAYLOAD_PY_SHA256: 1c9137d78f3eadb8a0575f0bed1250be00cbd0cd18b9c7bcf5f94d435ea228d8
  RUNTIME_PY_SHA256: 5f57450cb1c059ad37cf92529a2549719349d8d98a894393b61eccfce1e9783d

jobs:
  repair:
    if: github.event.head_commit.message == 'Bootstrap exact-head R1 final audit self-heal v6'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout isolated automation branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply, verify, and publish exact clean PR child
        id: heal
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
            test "$(git show -s --format=%s HEAD)" = 'Bootstrap exact-head R1 final audit self-heal v6'
            git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
            test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_BASE"

            cat .r1-final-audit/payload_*.b64 > /tmp/payload.b64
            base64 -d /tmp/payload.b64 > /tmp/payload.gz
            echo "$PAYLOAD_GZIP_SHA256  /tmp/payload.gz" | sha256sum -c -
            gzip -dc /tmp/payload.gz > /tmp/r1-final-audit.py
            echo "$PAYLOAD_PY_SHA256  /tmp/r1-final-audit.py" | sha256sum -c -
            python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/r1-final-audit.py')
          s = p.read_text(encoding='utf-8')
          fixes = [
              ("Under the applet\\'s conditional-independence assumption", "Under the stated conditional-independence assumption", 2),
              ("scikit-learn's default initialization uses a greedy k-means++ variant with multiple candidate trials.", "The scikit-learn default initialization uses a greedy k-means++ variant with multiple candidate trials.", 1),
          ]
          for old, new, expected in fixes:
              count = s.count(old)
              if count != expected:
                  raise SystemExit(f'Runtime source hotfix binding failed: expected {expected} occurrence(s), found {count}: {old!r}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
            echo "$RUNTIME_PY_SHA256  /tmp/r1-final-audit.py" | sha256sum -c -
            python -m py_compile /tmp/r1-final-audit.py

            rm -f .github/workflows/_r1-final-audit-selfheal.yml
            rm -rf .r1-final-audit
            echo 'BOOTSTRAP_BINDING_AND_PAYLOAD=PASS'

            python -m pip install --upgrade pip
            python -m pip install playwright
            python -m playwright install --with-deps chromium

            python /tmp/r1-final-audit.py --self-test --clone "$GITHUB_WORKSPACE"
            python /tmp/r1-final-audit.py --apply-only --clone "$GITHUB_WORKSPACE"

            cat > /tmp/expected-files <<'EOF'
          docs/PEDAGOGICAL_RED_TEAM_V1_1.md
          playgrounds/bayes-classifier/index.html
          playgrounds/bayes-network/index.html
          playgrounds/convolution/index.html
          playgrounds/hill-climbing/index.html
          playgrounds/kmeans/index.html
          playgrounds/knn-classifier/index.html
          playgrounds/neural-network/index.html
          playgrounds/overfitting/index.html
          playgrounds/q-learning-gridworld/index.html
          playgrounds/search-pathfinding/index.html
          playgrounds/wumpus-world/index.html
          tools/verify_pedagogical_contracts.py
          EOF
            LC_ALL=C sort -o /tmp/expected-files /tmp/expected-files
            git diff --name-only "$EXPECTED_HEAD" | LC_ALL=C sort > /tmp/actual-files
            diff -u /tmp/expected-files /tmp/actual-files
            git diff --check "$EXPECTED_HEAD"
            test ! -e .github/workflows/_r1-final-audit-selfheal.yml
            test ! -e .r1-final-audit
            echo 'FINAL_TREE_BOUNDARY=PASS files=13'

            git read-tree "$EXPECTED_HEAD"
            while IFS= read -r path; do
              git add -- "$path"
            done < /tmp/expected-files
            git diff --cached --name-only "$EXPECTED_HEAD" | LC_ALL=C sort > /tmp/staged-files
            diff -u /tmp/expected-files /tmp/staged-files
            git diff --cached --check "$EXPECTED_HEAD"

            TREE_SHA="$(git write-tree)"
            export GIT_AUTHOR_NAME='Logan M. Dixon'
            export GIT_AUTHOR_EMAIL='178442787+lmdixon23@users.noreply.github.com'
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            FINAL_SHA="$(printf '%s\n' 'Close final exact-head pedagogical audit residuals' | git commit-tree "$TREE_SHA" -p "$EXPECTED_HEAD")"
            test "$(git rev-parse "$FINAL_SHA^")" = "$EXPECTED_HEAD"

            git fetch --no-tags origin "+refs/heads/$PR_BRANCH:refs/remotes/origin/r1-pr-head"
            test "$(git rev-parse refs/remotes/origin/r1-pr-head)" = "$EXPECTED_HEAD"
            git push origin "$FINAL_SHA:refs/heads/$PR_BRANCH"
            echo "$FINAL_SHA" > /tmp/final-sha.txt
            echo "FINAL_SELF_HEAL_COMMIT=$FINAL_SHA"
          } 2>&1 | tee /tmp/selfheal.log

      - name: Record automation outcome on isolated branch
        if: always()
        shell: bash
        env:
          HEAL_OUTCOME: ${{ steps.heal.outcome }}
        run: |
          set -euo pipefail
          {
            echo "outcome=$HEAL_OUTCOME"
            echo "automation_sha=$GITHUB_SHA"
            if [ -f /tmp/final-sha.txt ]; then
              echo "final_sha=$(cat /tmp/final-sha.txt)"
            fi
            echo '--- log tail ---'
            tail -n 350 /tmp/selfheal.log 2>/dev/null || true
          } > /tmp/status.txt

          git reset --hard "$GITHUB_SHA"
          mkdir -p .r1-final-audit
          cp /tmp/status.txt .r1-final-audit/status.txt
          git config user.name 'R1 audit automation'
          git config user.email '178442787+lmdixon23@users.noreply.github.com'
          git add -- .r1-final-audit/status.txt
          git commit -m "Record R1 self-heal outcome: $HEAL_OUTCOME"
          git push origin "HEAD:refs/heads/$AUTOMATION_BRANCH"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r1-final-audit-selfheal-${{ github.run_id }}
          path: |
            release-evidence/
            /tmp/selfheal.log
            /tmp/final-sha.txt
          if-no-files-found: ignore
          retention-days: 90
