name: Publish v1.5.0

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-v1.5.0
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: v1.5.0
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact deployed revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Determine v1.5 publication intent
        id: intent
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/v15-intent
          import re
          from pathlib import Path
          cff = Path('CITATION.cff').read_text(encoding='utf-8')
          print('true' if re.search(r"(?m)^version:\s*['\"]?1\.5\.0['\"]?\s*$", cff) else 'false')
          PY
          PUBLISH="$(cat /tmp/v15-intent)"
          # Once v1.5 has an immutable tag, this historical publisher becomes
          # inert on later main deployments instead of failing future releases.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            PUBLISH=false
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "v1.5 publication intent: $PUBLISH"

      - name: Confirm exact current main revision
        if: steps.intent.outputs.publish == 'true'
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$MAIN_SHA" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Wait for exact-sha Verify PASS
        if: steps.intent.outputs.publish == 'true'
        run: |
          set -euo pipefail
          VERIFY_ID=""
          for attempt in $(seq 1 30); do
            VERIFY_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow Verify --commit "$RELEASE_SHA" --event push --json databaseId,status --jq 'map(select(.status == "completed" or .status == "in_progress" or .status == "queued"))[0].databaseId // empty')"
            if [ -n "$VERIFY_ID" ]; then
              break
            fi
            sleep 10
          done
          test -n "$VERIFY_ID"
          gh run watch "$VERIFY_ID" --repo "$GITHUB_REPOSITORY" --exit-status
          CONCLUSION="$(gh run view "$VERIFY_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')"
          test "$CONCLUSION" = "success"

      - name: Recheck v1.5 release metadata and public artifact
        if: steps.intent.outputs.publish == 'true'
        run: |
          set -euo pipefail
          # Exact-sha Verify has already run the browser integration gate. Keep
          # publication rechecks dependency-free and deterministic here.
          python tools/check_release_metadata.py
          python tools/build_site_v1_5.py

      - name: Fail closed if v1.5 tag or release appeared concurrently
        if: steps.intent.outputs.publish == 'true'
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing tag $TAG" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release $TAG" >&2
            exit 1
          fi

      - name: Prepare release notes
        if: steps.intent.outputs.publish == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          text = Path('RELEASE_NOTES.md').read_text(encoding='utf-8')
          marker = '## v1.5.0, 2026-08-25'
          start = text.index(marker)
          tail = text[start:]
          next_heading = tail.find('\n## v', len(marker))
          section = tail if next_heading < 0 else tail[:next_heading]
          body = section.split('\n', 1)[1].strip() + '\n'
          path = Path('release-evidence/v1.5.0-release-notes.md')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(body, encoding='utf-8')
          PY
          test -s release-evidence/v1.5.0-release-notes.md

      - name: Create immutable tag
        if: steps.intent.outputs.publish == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$RELEASE_SHA" -m "AI Playgrounds v1.5.0"
          git push origin "refs/tags/$TAG"

      - name: Publish GitHub release
        if: steps.intent.outputs.publish == 'true'
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "AI Playgrounds v1.5.0" \
            --notes-file release-evidence/v1.5.0-release-notes.md

      - name: Write publication receipt
        if: steps.intent.outputs.publish == 'true'
        run: |
          set -euo pipefail
          {
            echo "release=v1.5.0"
            echo "sha=$RELEASE_SHA"
            echo "deploy_run=${{ github.event.workflow_run.id }}"
            echo "tag=$TAG"
          } > release-evidence/v1.5.0-publication-receipt.txt

      - name: Upload publication receipt
        if: steps.intent.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ai-playgrounds-v1.5.0-publication-${{ github.event.workflow_run.id }}
          path: |
            release-evidence/v1.5.0-publication-receipt.txt
            release-evidence/v1.5.0-release-notes.md
          retention-days: 90
