name: Migrate v1.9 R3 source metadata

on:
  push:
    branches:
      - refactor/v1.9-shared-page-components-r3

permissions:
  contents: write

jobs:
  migrate-source-metadata:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R3 branch
        uses: actions/checkout@v6
        with:
          ref: refactor/v1.9-shared-page-components-r3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Promote templates and components to canonical ownership
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          labs_path = root / 'src/product/labs.json'
          release_path = root / 'src/product/release.json'
          component_path = root / 'src/product/page-components.json'

          labs = json.loads(labs_path.read_text(encoding='utf-8'))
          release = json.loads(release_path.read_text(encoding='utf-8'))
          graph = json.loads(component_path.read_text(encoding='utf-8'))
          by_slug = {row['slug']: row for row in graph['pages']}

          if len(by_slug) != 15 or graph.get('component_count') != 17:
              raise SystemExit('R3 source graph is not the accepted 15-page / 17-component graph')

          for lab in labs['labs']:
              slug = lab['slug']
              page = by_slug[slug]
              old = lab['implementation']
              lab['implementation'] = {
                  'kind': 'canonical-template-with-shared-components-and-legacy-equivalence',
                  'primary': page['template'],
                  'component_manifest': 'src/product/page-components.json',
                  'legacy_equivalence': old,
              }

          release['architecture_phase'] = 'v1.9-r3-shared-page-components'
          release['canonical_page_component_manifest'] = 'src/product/page-components.json'
          release['canonical_page_template_root'] = 'src/labs'
          release['canonical_component_root'] = 'src/ui/components'
          release['canonical_page_count'] = 15
          release['canonical_component_count'] = 17
          release['canonical_deduplicated_bytes'] = graph['deduplicated_bytes']
          release.pop('canonical_peer_page_root', None)
          release.pop('canonical_peer_page_slugs', None)
          release['historical_manifest_note'] = (
              'Historical applet sources, candidate builders, and release-layer transforms remain '
              'legacy equivalence/provenance inputs during R3. Current final applet-page authority is '
              'src/labs/*/index.template.html plus src/product/page-components.json; current public '
              'catalogue authority remains src/product/catalogue.json.'
          )

          labs_path.write_text(json.dumps(labs, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          release_path.write_text(json.dumps(release, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit R3 canonical ownership metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/product/labs.json src/product/release.json
          if git diff --cached --quiet; then
            echo 'R3 source metadata already migrated; no commit needed.'
            exit 0
          fi
          git commit -m 'v1.9 R3: promote templates and components to canonical page ownership'
          git push origin HEAD:refactor/v1.9-shared-page-components-r3
