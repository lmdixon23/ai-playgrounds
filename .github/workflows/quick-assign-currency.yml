name: Quick Assign and release currency

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-assign-currency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Quick Assign, locale, and release-currency checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Chromium QA dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run Quick Assign and semantic release-currency gate
        run: python tools/test_v1_6_1_quick_assign_currency.py
