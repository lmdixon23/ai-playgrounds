name: Smoke v1.9 R4b token components

on:
  push:
    branches:
      - refactor/v1.9-token-owned-components-r4b

permissions:
  contents: read

jobs:
  validate-token-components:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate final token-template component graph
        run: python tools/token_components.py
      - name: Reconstruct all 15 canonical pages from mixed raw/token-template components
        run: python tools/page_components.py
      - name: Validate R4b design-token and binding contract
        run: python tools/design_tokens.py
      - name: Build complete current product and enforce frozen 58-file oracle
        run: python tools/build_current.py
