name: R4 assistant semantic translation review

on:
  push:
    branches:
      - feature/v1.1.0-vi-es-localization-r4
    paths:
      - '.github/workflows/_r4-assistant-semantic-review.yml'

permissions:
  contents: write

jobs:
  integrate-test-publish:
    if: github.event.head_commit.message == 'Run R4 assistant semantic translation review'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bind staged review boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1f248d841018be734476b5942c8a83c83c63eedf"
          test "$(git merge-base HEAD 305360568063474eb12fb54a4b19df8f50935a59)" = "305360568063474eb12fb54a4b19df8f50935a59"
          python - <<'PY'
          import subprocess
          allowed={
            '.github/workflows/_r4-assistant-semantic-review.yml',
            '.r4-assistant-review/R4_ASSISTANT_TRANSLATION_AUDIT.md',
            '.r4-assistant-review/verify_r4_locale_catalog.py',
            '.r4-assistant-review/common.b64.part00',
            '.r4-assistant-review/common.b64.part01',
            '.r4-assistant-review/common.b64.part02',
            '.r4-assistant-review/common.b64.part03',
            '.r4-assistant-review/common.b64.part04',
          }
          raw=subprocess.check_output(['git','diff','--name-only','305360568063474eb12fb54a4b19df8f50935a59..HEAD','-z'])
          got={x.decode() for x in raw.split(b'\0') if x}
          if got != allowed:
              raise SystemExit(f'Staged review boundary mismatch. Missing={sorted(allowed-got)} Unexpected={sorted(got-allowed)}')
          print('R4_ASSISTANT_STAGING_BOUNDARY=PASS files=8')
          PY

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Materialize reviewed files
        shell: bash
        run: |
          set -euo pipefail
          cat .r4-assistant-review/common.b64.part* | base64 -d | gzip -d > assets/locales/common-r4.js
          cp .r4-assistant-review/verify_r4_locale_catalog.py tools/verify_r4_locale_catalog.py
          cp .r4-assistant-review/R4_ASSISTANT_TRANSLATION_AUDIT.md docs/R4_ASSISTANT_TRANSLATION_AUDIT.md
          echo '37a5d685f18829296fd61f749677797822a8f0c593f19d18a6495fa1da0dbb06  assets/locales/common-r4.js' | sha256sum -c -
          echo 'a98bf43cd792bda2616d5dc43ff35fbc17267469c21765b0d64bf13d88878205  tools/verify_r4_locale_catalog.py' | sha256sum -c -
          echo 'f8e9ce5ee9ffaa2ca434fb9ccc8df60d68dbf263c6e0585e6725c4aab60ae9f0  docs/R4_ASSISTANT_TRANSLATION_AUDIT.md' | sha256sum -c -
          node --check assets/locales/common-r4.js
          python -m py_compile tools/verify_r4_locale_catalog.py
          git diff --check
          echo 'R4_REVIEWED_FILES_MATERIALIZED=PASS'

      - name: Install browser QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run complete exact-head v1.1 stack
        shell: bash
        run: |
          set -euo pipefail
          python tools/release_check.py
          python tools/verify_pedagogical_contracts.py
          python tools/verify_guided_challenges.py
          python tools/guided_challenge_qa.py
          python tools/verify_zh_parity.py
          python tools/zh_parity_qa.py
          python tools/verify_r4_localization.py
          python tools/verify_wumpus_percept_localization.py
          python tools/r4_localization_qa.py
          python tools/check_release_metadata.py
          python tools/build_site.py
          python tools/run_algorithm_tests.py
          python tools/browser_qa.py --no-screenshots
          echo 'R4_ASSISTANT_FULL_STACK=PASS'

      - name: Remove staging infrastructure and verify final diff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .r4-assistant-review
          rm .github/workflows/_r4-assistant-semantic-review.yml
          git diff --check
          python - <<'PY'
          import subprocess
          expected={
            '.github/workflows/_r4-assistant-semantic-review.yml',
            '.r4-assistant-review/R4_ASSISTANT_TRANSLATION_AUDIT.md',
            '.r4-assistant-review/verify_r4_locale_catalog.py',
            '.r4-assistant-review/common.b64.part00',
            '.r4-assistant-review/common.b64.part01',
            '.r4-assistant-review/common.b64.part02',
            '.r4-assistant-review/common.b64.part03',
            '.r4-assistant-review/common.b64.part04',
            'assets/locales/common-r4.js',
            'docs/R4_ASSISTANT_TRANSLATION_AUDIT.md',
            'tools/verify_r4_locale_catalog.py',
          }
          raw=subprocess.check_output(['git','status','--porcelain=v1','-z'])
          paths=set()
          for row in [x for x in raw.split(b'\0') if x]:
              text=row.decode('utf-8','replace')
              if len(text)>=4: paths.add(text[3:])
          if paths != expected:
              raise SystemExit(f'Final worktree boundary mismatch. Missing={sorted(expected-paths)} Unexpected={sorted(paths-expected)}')
          print('R4_FINAL_WORKTREE_BOUNDARY=PASS files=11')
          PY

      - name: Commit tested semantic review
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- \
            assets/locales/common-r4.js \
            docs/R4_ASSISTANT_TRANSLATION_AUDIT.md \
            tools/verify_r4_locale_catalog.py \
            .r4-assistant-review \
            .github/workflows/_r4-assistant-semantic-review.yml
          git diff --cached --check
          git config user.name 'Logan M. Dixon'
          git config user.email '178442787+lmdixon23@users.noreply.github.com'
          git commit -m 'Integrate assistant-reviewed Vietnamese and Spanish semantics'
          final_sha="$(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/feature/v1.1.0-vi-es-localization-r4
          echo "R4_ASSISTANT_REVIEWED_HEAD=$final_sha" >> "$GITHUB_STEP_SUMMARY"
          echo 'FINAL_R4_ASSISTANT_SEMANTIC_REVIEW=PASS' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r4-assistant-semantic-review-${{ github.run_id }}
          path: release-evidence/
          if-no-files-found: ignore
          retention-days: 90
