name: Migrate v1.9 R4a build contract

on:
  push:
    branches:
      - refactor/v1.9-design-token-contract-r4a

permissions:
  contents: write

jobs:
  migrate-build-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/v1.9-design-token-contract-r4a
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Make token contract a current-build invariant
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/build_current.py')
          text = path.read_text(encoding='utf-8')

          edits = [
            (
              'import page_components\n',
              'import page_components\nimport design_tokens\n',
            ),
            (
              'R3_EVIDENCE = ROOT / "release-evidence" / "v1.9-canonical-source-r3.json"\nBASELINE_SHA',
              'R3_EVIDENCE = ROOT / "release-evidence" / "v1.9-canonical-source-r3.json"\nR4A_EVIDENCE = ROOT / "release-evidence" / "v1.9-canonical-source-r4a.json"\nBASELINE_SHA',
            ),
            (
              'CURRENT_PHASE = "v1.9-r3-shared-page-components"',
              'CURRENT_PHASE = "v1.9-r4a-design-token-contract"',
            ),
            (
              '    pages = page_components.load_and_validate()\n\n    if release.get("architecture_phase")',
              '    pages = page_components.load_and_validate()\n    token_contract = design_tokens.validate_contract()\n\n    if release.get("architecture_phase")',
            ),
            (
              '        "canonical_deduplicated_bytes": page_components.EXPECTED_DEDUPLICATED_BYTES,\n    }',
              '        "canonical_deduplicated_bytes": page_components.EXPECTED_DEDUPLICATED_BYTES,\n        "design_token_contract": "src/design/ai-playgrounds.tokens.json",\n        "design_token_bindings": "src/design/current-bindings.json",\n        "design_token_format": "DTCG 2025.10",\n        "design_token_phase": "contract-first-frozen-output-binding",\n    }',
            ),
            (
              '        "page_components": pages,\n        "lab_count": len(labs),',
              '        "page_components": pages,\n        "design_tokens": token_contract,\n        "lab_count": len(labs),',
            ),
            (
              '        "phase": CURRENT_PHASE,\n        "baseline_source_sha": BASELINE_SHA,\n        "canonical_catalogue": "src/product/catalogue.json",\n        "canonical_page_component_manifest": "src/product/page-components.json",',
              '        "phase": "v1.9-r3-shared-page-components",\n        "baseline_source_sha": BASELINE_SHA,\n        "canonical_catalogue": "src/product/catalogue.json",\n        "canonical_page_component_manifest": "src/product/page-components.json",',
            ),
            (
              '    if not comparison["pass"]:\n        raise RuntimeError(\n            "R3 current build differs from frozen v1.8.1 byte oracle: "',
              '    write_evidence(R4A_EVIDENCE, {\n        "phase": CURRENT_PHASE,\n        "baseline_source_sha": BASELINE_SHA,\n        "design_token_contract": "src/design/ai-playgrounds.tokens.json",\n        "design_token_bindings": "src/design/current-bindings.json",\n        "design_token_schema": model["design_tokens"]["schema"],\n        "design_token_format": model["design_tokens"]["format"],\n        "token_count": model["design_tokens"]["token_count"],\n        "alias_count": model["design_tokens"]["alias_count"],\n        "type_counts": model["design_tokens"]["type_counts"],\n        "theme_profiles": {\n            "profiles": model["design_tokens"]["theme_profiles"]["profiles"],\n            "slugs": model["design_tokens"]["theme_profiles"]["slugs"],\n            "checks": model["design_tokens"]["theme_profiles"]["checks"],\n            "pass": model["design_tokens"]["theme_profiles"]["pass"],\n        },\n        "accent_bindings": {\n            "slugs": model["design_tokens"]["accents"]["slugs"],\n            "checks": model["design_tokens"]["accents"]["checks"],\n            "minimaxMismatchPreserved": model["design_tokens"]["accents"]["minimaxMismatchPreserved"],\n            "pass": model["design_tokens"]["accents"]["pass"],\n        },\n        "component_literal_bindings": {\n            "bindings": model["design_tokens"]["component_literal_bindings"]["bindings"],\n            "pass": model["design_tokens"]["component_literal_bindings"]["pass"],\n        },\n        "page_graph": model["design_tokens"]["page_graph"],\n        "model": common_model,\n        "catalogue": catalogue_check,\n        "artifact": comparison,\n    })\n\n    if not comparison["pass"]:\n        raise RuntimeError(\n            "R4a current build differs from frozen v1.8.1 byte oracle: "',
            ),
            (
              '        "v1.9 R3 current build: PASS — canonical catalogue plus 15 template/component pages own final public bytes; "',
              '        "v1.9 R4a current build: PASS — DTCG token contract validated before canonical page/catalogue handoff; "',
            ),
          ]
          for old, new in edits:
              if old not in text:
                  raise SystemExit(f'R4a build migration anchor missing: {old[:120]!r}')
              text = text.replace(old, new, 1)
          text = text.replace('raise RuntimeError("R3 must remain bound to exact public v1.8.1")', 'raise RuntimeError("R4a must remain bound to exact public v1.8.1")', 1)
          text = text.replace('raise RuntimeError("R3 baseline source SHA changed")', 'raise RuntimeError("R4a baseline source SHA changed")', 1)
          text = text.replace('raise RuntimeError("R3 public boundary must remain 58 files / 15 applets")', 'raise RuntimeError("R4a public boundary must remain 58 files / 15 applets")', 1)
          text = text.replace('raise RuntimeError("R3 curriculum track-count boundary changed")', 'raise RuntimeError("R4a curriculum track-count boundary changed")', 1)
          text = text.replace('raise RuntimeError("R3 learner locale order changed")', 'raise RuntimeError("R4a learner locale order changed")', 1)
          text = text.replace('raise RuntimeError("R3 Quick Assign count changed")', 'raise RuntimeError("R4a Quick Assign count changed")', 1)
          text = text.replace('f"R3 release source boundary drift for {key}:', 'f"R4a release source boundary drift for {key}:', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit R4a build integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/build_current.py
          git commit -m 'v1.9 R4a: make design-token contract a build invariant'
          git push origin HEAD:refactor/v1.9-design-token-contract-r4a
