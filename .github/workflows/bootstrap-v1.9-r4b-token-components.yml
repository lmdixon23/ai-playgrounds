name: Bootstrap v1.9 R4b token-component templates

on:
  push:
    branches:
      - refactor/v1.9-token-owned-components-r4b

permissions:
  contents: write

jobs:
  materialize-token-component-templates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/v1.9-token-owned-components-r4b
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Materialize token templates alongside current raw components
        run: python tools/bootstrap_v1_9_r4b_token_components.py
      - name: Commit candidate token templates and manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/design/token-components.json src/ui/components/**/*.template.html
          if git diff --cached --quiet; then
            echo 'R4b token templates already materialized; no commit needed.'
            exit 0
          fi
          git commit -m 'v1.9 R4b: materialize exact token-component templates'
          git push origin HEAD:refactor/v1.9-token-owned-components-r4b
