name: R4 browser QA compatibility repair

on:
  push:
    branches:
      - automation/r4-generated-candidate
    paths:
      - '.github/workflows/_r4-browser-qa-compat-repair.yml'

permissions:
  contents: write

jobs:
  repair-test-publish:
    if: github.event.head_commit.message == 'Run fail-closed R4 browser QA compatibility repair'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bind repair parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a3c71b02a8b77537edc25db83bb1a735d2d7c944"
          python -m py_compile tools/_r4_browser_qa_fix.py

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Apply exact compatibility patch
        run: |
          set -euo pipefail
          python tools/_r4_browser_qa_fix.py
          python -m py_compile tools/browser_qa.py
          git diff --check

      - name: Install browser QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run full browser QA on patched candidate
        run: python tools/browser_qa.py --no-screenshots

      - name: Remove temporary repair infrastructure
        run: |
          set -euo pipefail
          rm tools/_r4_browser_qa_fix.py
          rm .github/workflows/_r4-browser-qa-compat-repair.yml
          git diff --check

      - name: Commit tested QA compatibility fix
        run: |
          set -euo pipefail
          git add -- tools/browser_qa.py tools/_r4_browser_qa_fix.py .github/workflows/_r4-browser-qa-compat-repair.yml
          staged="$(git diff --cached --name-only | sort)"
          expected=$'.github/workflows/_r4-browser-qa-compat-repair.yml\ntools/_r4_browser_qa_fix.py\ntools/browser_qa.py'
          test "$staged" = "$expected"
          git diff --cached --check
          git config user.name 'Logan M. Dixon'
          git config user.email '178442787+lmdixon23@users.noreply.github.com'
          git commit -m 'Make full browser QA R4 locale aware'
          git push origin HEAD:refs/heads/automation/r4-generated-candidate
          echo "R4_TESTED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'FINAL_R4_BROWSER_QA_COMPATIBILITY_REPAIR=PASS' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r4-browser-qa-compat-${{ github.run_id }}
          path: release-evidence/browser-qa/
          if-no-files-found: ignore
          retention-days: 90
