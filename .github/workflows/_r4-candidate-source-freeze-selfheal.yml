name: R4 candidate source-freeze self-heal

on:
  push:
    branches:
      - automation/r4-generated-candidate
    paths:
      - '.github/workflows/_r4-candidate-source-freeze-selfheal.yml'

permissions:
  contents: write

jobs:
  repair-test-publish:
    if: github.event.head_commit.message == 'Bootstrap R4 candidate source-freeze self-heal'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bind candidate parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "d1b838ebf3b16d64e9dacd2f5146dcd848cf9c12"
          echo 'R4_SELFHEAL_PARENT=PASS'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Restore frozen R3 Wumpus Guided Challenge contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/guided-challenges.js')
          s=p.read_text(encoding='utf-8')
          start=s.index("    'wumpus-world': {")
          end=s.index("    'cnf-sat': {", start)
          block=s[start:end]
          fixes=[
            ("      scenario: 2, transferScenario: 1, action: '#stepBtn', actionClicks: 1,", "      scenario: 4, transferScenario: 2, action: '#stepBtn', actionClicks: 1,"),
            ("        transfer: 'Changed case: switch to the AIMA-inspired hybrid heuristic and reconsider the same frontier evidence without probability ranking.'", "        transfer: 'Changed case: switch to the probability-based policy and reconsider the same kind of frontier evidence.'"),
            ("        transfer: '迁移情境：切换到 AIMA 启发式混合策略，在不按概率排序的情况下重新判断同类前沿证据。'", "        transfer: '迁移情境：切换到概率策略，再判断类似的前沿证据。'"),
          ]
          for old,new in fixes:
              count=block.count(old)
              if count != 1:
                  raise SystemExit(f'Wumpus source-freeze binding failed: {count=} {old!r}')
              block=block.replace(old,new,1)
          s=s[:start]+block+s[end:]
          p.write_text(s,encoding='utf-8',newline='\n')
          print('R4_WUMPUS_R3_CONTRACT_RESTORED=PASS')
          PY
          git diff --check

      - name: Install browser QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run complete R4 verification stack
        shell: bash
        run: |
          set -euo pipefail
          python tools/release_check.py
          python tools/verify_pedagogical_contracts.py
          python tools/verify_guided_challenges.py
          python tools/guided_challenge_qa.py
          python tools/verify_zh_parity.py
          python tools/zh_parity_qa.py
          python tools/verify_r4_localization.py
          python tools/r4_localization_qa.py
          python tools/check_release_metadata.py
          python tools/build_site.py
          python tools/run_algorithm_tests.py
          python tools/browser_qa.py --no-screenshots
          echo 'R4_FULL_STACK=PASS'

      - name: Remove temporary workflow and verify final boundary
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_r4-candidate-source-freeze-selfheal.yml
          git diff --check
          python - <<'PY'
          import subprocess
          raw=subprocess.check_output(['git','diff','--name-only','HEAD^','-z'])
          changed={p.decode() for p in raw.split(b'\0') if p}
          # HEAD^ is d1b838...; after deleting the bootstrap workflow the only
          # intended worktree change is the frozen Wumpus contract restoration.
          allowed={'assets/guided-challenges.js','.github/workflows/_r4-candidate-source-freeze-selfheal.yml'}
          current=subprocess.check_output(['git','status','--porcelain=v1'],text=True)
          print(current)
          PY

      - name: Commit tested candidate and fast-forward branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- assets/guided-challenges.js .github/workflows/_r4-candidate-source-freeze-selfheal.yml
          git diff --cached --check
          staged="$(git diff --cached --name-only | sort)"
          expected=$'.github/workflows/_r4-candidate-source-freeze-selfheal.yml\nassets/guided-challenges.js'
          test "$staged" = "$expected"
          git config user.name 'Logan M. Dixon'
          git config user.email '178442787+lmdixon23@users.noreply.github.com'
          git commit -m 'Restore frozen Wumpus challenge contract in R4 candidate'
          final_sha="$(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/automation/r4-generated-candidate
          echo "R4_TESTED_CANDIDATE=$final_sha" >> "$GITHUB_STEP_SUMMARY"
          echo 'FINAL_R4_CANDIDATE_SELFHEAL=PASS' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r4-candidate-selfheal-${{ github.run_id }}
          path: release-evidence/
          if-no-files-found: ignore
          retention-days: 90
