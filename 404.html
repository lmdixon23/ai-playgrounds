ation, and when should the algorithm stop?":"每次迭代中什么会改变，算法何时应停止？","Slide kernels across an image, inspect each multiply-and-sum, and compare hand-built with learned filters.":"让卷积核在图像上滑动，检查每次乘加，并比较手工滤波器与学习得到的滤波器。","Connect local filters to feature maps and learned visual representations.":"将局部滤波器与特征图和学习得到的视觉表示连接起来。","Why can a small matrix reveal edges, blur, or sharpen an image?":"为什么一个小矩阵能够显示边缘、模糊或锐化图像？","Train by trial and error, inspect value backups, and compare exploration schedules on the same world.":"通过试错训练，检查价值回传，并在同一环境中比较探索计划。","Conclude with trial-and-error learning, delayed reward, and policy emergence.":"以试错学习、延迟奖励和策略形成作为总结。","How does useful behavior emerge from repeated trial and error?":"有用行为如何从反复试错中形成？","Use one page to record a prediction, evidence, explanation, and transfer. No backend stores this packet. The strongest responses name a setting, cite a visible result, and connect that result to the mechanism.":"用一页记录预测、证据、解释和迁移。后端不会保存此记录。高质量回答会明确设置、引用可见结果，并将结果与机制连接起来。","Name":"姓名","Applet and scenario":"Applet 与情境","Date":"日期","1. Predict":"1. 预测","Commit before running.":"运行前先明确预测。","2. Observe":"2. 观察","Record visible evidence.":"记录可见证据。","3. Explain":"3. 解释","Name the mechanism.":"指出机制。","4. Transfer":"4. 迁移","Apply the idea elsewhere.":"将概念应用到其他情境。","Predict":"预测","Which result will change most? State the setting and your reason before applying the scenario.":"哪个结果变化最大？在应用情境前写出设置与理由。","Observe":"观察","Record one visible pattern, one number or state value, and one result that differed from your prediction.":"记录一个可见模式、一个数字或状态值，以及一个与预测不同的结果。","Explain":"解释","Use the visual explanation or text-state summary. What mechanism caused the result?":"使用视觉解释或文本状态摘要。哪个机制导致了该结果？","Where would the same mechanism appear in another AI system, subject, or decision?":"同一机制还会出现在哪个 AI 系统、学科或决策中？","Evidence check":"证据检查","□ Setting named":"□ 已写明设置","□ Result cited":"□ 已引用结果","□ Mechanism explained":"□ 已解释机制","Confidence after testing":"测试后的信心","□ Low":"□ 低","□ Medium":"□ 中","□ High":"□ 高","AI Playgrounds is built for direct classroom use, offline portability, and transparent inspection. This page explains the practical choices behind the suite and the limits of the current evidence.":"AI Playgrounds 面向直接课堂使用、离线便携性和透明检查而构建。本页说明套件背后的实际选择以及当前证据的边界。","Portable by design":"以便携为设计原则","Each applet is one HTML file containing its interface and logic. It can run locally without an account, backend, model download, or build process.":"每个 applet 都是一个包含界面与逻辑的 HTML 文件。无需账户、后端、模型下载或构建流程即可在本地运行。","Student work stays local":"学生作业保留在本地","The site does not collect student responses. Response packets are copied or printed by the learner and submitted through the teacher's normal classroom system.":"网站不收集学生回答。学习者复制或打印实验记录，并通过教师常用的课堂系统提交。","Multiple ways to read the result":"以多种方式读取结果","Each applet includes keyboard guidance, live text-state descriptions, reduced-motion support, and explanations that do not rely only on color or animation.":"每个 applet 都包含键盘指引、实时文本状态描述、减少动态效果支持，以及不只依赖颜色或动画的解释。","Learning design":"学习设计","Featured experiments and scenario comparisons ask learners to predict, observe, explain, and transfer. Teacher notes identify the misconception being surfaced and what the simplified model leaves out.":"精选实验和情境比较要求学习者预测、观察、解释和迁移。教师说明指出实验所揭示的常见误解，以及简化模型未包含的内容。","Software checks":"软件检查","The repository includes algorithmic regression tests, source checks, and a browser matrix for mobile, tablet, and desktop viewports.":"代码库包含算法回归测试、源代码检查，以及覆盖手机、平板和桌面视口的浏览器矩阵。","Open for adaptation":"开放改编","The project is released under the MIT License. Teachers and developers can take one applet, translate it, change parameters, or build new scenarios.":"本项目采用 MIT 许可证发布。教师和开发者可以选取一个 applet，进行翻译、修改参数或构建新情境。","What the current release does not establish":"当前版本尚未证实的内容","It does not demonstrate improved learning outcomes without a separate learner study.":"没有独立学习者研究时，它不能证实学习成果得到提高。","It does not establish accessibility conformance without human assistive-technology testing.":"没有人工辅助技术测试时，它不能确立无障碍符合性。","Page views do not establish adoption, classroom use, or educational impact.":"页面浏览量不能证明采用情况、课堂使用或教育影响。","Use the final tagged release as the artifact of record for papers, reviews, and classroom documentation.":"论文、评审和课堂文档应以最终打标签的版本作为正式记录成果。","Author":"作者","Citation files":"引用文件","Verification":"验证","Release reference":"发布引用信息","After the final release is tagged, record the tag, commit hash, archive DOI, and paper citation here. Until then, cite the repository URL and access date.":"最终版本打标签后，在此记录标签、提交哈希、归档 DOI 和论文引用。在此之前，请引用代码库网址和访问日期。","A concise overview of the current public release.":"当前公开版本的简要概览。","Core suite":"核心套件","12 bilingual, single-file applets covering search, logic, probability, machine learning, vision, and reinforcement learning.":"十二个双语、单文件 applet，涵盖搜索、逻辑、概率、机器学习、视觉和强化学习。","Instructional layer":"教学层","Five scenarios per applet, a featured comparison, a visual explanation, worksheet prompts, student response packet, and text-state accessibility support.":"每个 applet 包含五个情境、一个精选比较、视觉解释、练习提示、学生实验记录和文本状态无障碍支持。","Teacher materials":"教师材料","Printable Teacher Pack, responsive Curriculum Map, one-page Student Lab Packet, public Quality Notes, and release notes.":"可打印教师包、响应式课程地图、单页学生实验记录、公开质量说明和发布说明。","Open and portable":"开放且便携","Each applet runs as one HTML file, works locally without an account, and includes shareable experiments, printable response packets, and bilingual guidance.":"每个 applet 都以单个 HTML 文件运行，无需账户即可在本地使用，并包含可分享实验、可打印实验记录和双语指引。","Reliable experiment links":"可靠的实验链接","Copied links use the current controls as the authoritative state, including manual changes made after applying a scenario.":"复制链接以当前控件作为权威状态，包括应用情境后进行的手动更改。","Complete English and Chinese journeys":"完整的英文与中文使用旅程","Applet explanations, dynamic hints, shared controls, landing-page content, and educator materials now switch as complete language experiences.":"Applet 解释、动态提示、共享控件、首页内容和教师材料现在都会作为完整语言体验一起切换。","Technical verification":"技术验证","Algorithmic tests cover all twelve applets.":"算法测试覆盖全部十二个 applet。","Automated browser checks cover mobile, tablet, and desktop layouts.":"自动浏览器检查覆盖手机、平板和桌面布局。","Print layouts and offline operation are included in the public release.":"公开版本包含打印布局与离线运行支持。","Scope":"范围","The project provides interactive teaching tools. Claims about learning gains, classroom adoption, or accessibility conformance require separate classroom and user studies.":"本项目提供交互式教学工具。有关学习增益、课堂采用或无障碍符合性的主张，需要独立的课堂研究和用户研究。","Printable teacher pack for AI Playgrounds: classroom routes, lesson sequences, student lab packet guidance, curriculum map, privacy notes, and reuse guidance.":"AI Playgrounds 可打印教师包：课堂路径、课程顺序、学生实验记录指导、课程地图、隐私说明与再使用指南。","Course-aligned and quick-entry sequences for twelve foundational AI applets.":"十二个基础 AI applet 的课程对齐顺序与快速入门顺序。","One-page printable lab packet for AI Playgrounds experiments.":"用于 AI Playgrounds 实验的单页可打印实验记录。","Practical architecture, privacy, accessibility, testing, and evidence notes for AI Playgrounds.":"AI Playgrounds 的架构、隐私、无障碍、测试与证据说明。","Research, verification, and citation routes for AI Playgrounds.":"AI Playgrounds 的研究、验证与引用路径。","Public release notes for AI Playgrounds.":"AI Playgrounds 公开发布说明。"};
  const titleEn = document.title;
  const desc = document.querySelector('meta[name="description"]');
  const descEn = desc ? desc.content : '';
  const params = new URLSearchParams(location.search);
  let language = params.get('lang') || localStorage.getItem('ai-playgrounds-lang') || 'en';
  if(language !== 'zh') language = 'en';
  const shouldSkip = node => node.parentElement && node.parentElement.closest('script,style,noscript,code,pre,[data-i18n-skip]');
  const translateTextNodes = () => {
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(node=>{
      if(shouldSkip(node)) return;
      const raw=node.nodeValue, trimmed=raw.trim(); if(!trimmed) return;
      if(node.__supportEn === undefined) node.__supportEn=trimmed;
      const en=node.__supportEn;
      const next=language==='zh'?(dictionary[en]||en):en;
      node.nodeValue=raw.slice(0,raw.indexOf(trimmed))+next+raw.slice(raw.indexOf(trimmed)+trimmed.length);
    });
  };
  const translateAttributes = () => {
    document.querySelectorAll('[title],[aria-label],[placeholder]').forEach(el=>{
      ['title','aria-label','placeholder'].forEach(attr=>{
        if(!el.hasAttribute(attr)) return;
        const key='supportEn'+attr.replace('-','');
        if(el.dataset[key]===undefined) el.dataset[key]=el.getAttribute(attr);
        const en=el.dataset[key]; el.setAttribute(attr,language==='zh'?(dictionary[en]||en):en);
      });
    });
  };
  const localizeLinks = () => {
    document.querySelectorAll('a[href]').forEach(a=>{
      const raw=a.getAttribute('href');
      if(!raw || raw.startsWith('#') || raw.startsWith('mailto:') || raw.startsWith('javascript:')) return;
      try{
        const u=new URL(raw,location.href);
        if(u.origin===location.origin && /\.html$|\/$/.test(u.pathname)){
          u.searchParams.set('lang',language);
          a.setAttribute('href',u.href);
        }
      }catch(_){ }
    });
  };
  function apply(next,updateUrl){
    language=next==='zh'?'zh':'en';
    document.documentElement.lang=language==='zh'?'zh-Hans':'en';
    document.title=language==='zh'?(dictionary[titleEn]||titleEn):titleEn;
    if(desc) desc.content=language==='zh'?(dictionary[descEn]||descEn):descEn;
    translateTextNodes(); translateAttributes(); localizeLinks();
    document.querySelectorAll('[data-support-lang]').forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.supportLang===language)));
    localStorage.setItem('ai-playgrounds-lang',language);
    if(updateUrl){ const u=new URL(location.href);u.searchParams.set('lang',language);history.replaceState(null,'',u); }
    document.dispatchEvent(new CustomEvent('supportlanguagechange',{detail:{language}}));
  }
  const switcher=document.createElement('nav'); switcher.className='support-language-switch'; switcher.setAttribute('aria-label','Language / 语言');
  switcher.innerHTML='<button type="button" data-support-lang="en">EN</button><button type="button" data-support-lang="zh">中文</button>';
  const main=document.querySelector('main')||document.body; main.insertBefore(switcher,main.firstChild);
  switcher.addEventListener('click',e=>{const b=e.target.closest('[data-support-lang]');if(b)apply(b.dataset.supportLang,true)});
  apply(language,false);
  window.setSupportLanguage=apply;
})();
</script></body></html>
